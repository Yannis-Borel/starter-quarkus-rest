# ==========================
# HTTP: 8081, so that the bot can run at the same time as the API (8080)
# ==========================
quarkus.http.port=8081

# ==========================
# REST API called by the bot (MicroProfile Rest Client, configKey "api")
# API_URL environment variable, default: the API started locally
# ==========================
quarkus.rest-client.api.url=${API_URL:http://localhost:8080}

# ==========================
# Discord token: read from the DISCORD_TOKEN environment variable
# (MicroProfile Config maps DISCORD_TOKEN to discord.token). Never write it here.
# ==========================
